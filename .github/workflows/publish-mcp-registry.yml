name: Publish released version to MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing public release tag, for example v0.5.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-registry-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'emergent-wisdom/meaning-model' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify released package identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          jq -e --arg v "$VERSION" '
            .name == "io.github.emergent-wisdom/meaning-model" and
            .version == $v and
            .repository.url == "https://github.com/emergent-wisdom/meaning-model" and
            (.packages | length == 1) and
            .packages[0].registryType == "npm" and
            .packages[0].identifier == "@emergent-wisdom/meaning-model-mcp" and
            .packages[0].version == $v
          ' server.json
          jq -e --arg v "$VERSION" '.name == "@emergent-wisdom/meaning-model-mcp" and .version == $v' mcp-server/package.json
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease |
            jq -e --arg tag "$RELEASE_TAG" '.tagName == $tag and .isDraft == false and .isPrerelease == false'
          test "$(npm view "@emergent-wisdom/meaning-model-mcp@$VERSION" version --registry=https://registry.npmjs.org/)" = "$VERSION"
      - name: Install verified MCP publisher
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate and publish to MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
