name: Verify public engine release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published version tag to verify, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-engine-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  verify:
    name: Download and smoke ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ENGINE_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Validate tag, package version and native target
        run: |
          node mcp-server/scripts/package-engine-release.mjs --check
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Install locked MCP dependencies without lifecycle scripts
        run: npm ci --prefix mcp-server --ignore-scripts
      - name: Download the public engine and smoke native Rust and MCP
        run: node mcp-server/scripts/package-engine-release.mjs --verify-public
