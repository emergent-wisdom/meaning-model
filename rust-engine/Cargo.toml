[package]
name = "life-sim-engine"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Meaning Model construction, revision, persistence, and optional numerical simulation"

[lib]
name = "life_sim_engine"
path = "src/lib.rs"

[[bin]]
name = "life-sim-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
# Persistent sorted maps: each stored narrative revision shares its unchanged records with its parent.
rpds = "1.2"
# Graph algorithms (cycle detection with a named cycle) instead of hand-written copies.
petgraph = { version = "0.8", default-features = false, features = ["std", "graphmap"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
